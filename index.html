<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💖 CTSS | Valentine's Day 💖</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.png" />

    <!-- jQuery + FontAwesome (for heart icons) -->
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <style>
        /* ===== RESET & FULL CANVAS LAYER ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            /* locked until reminder appears */
            -webkit-touch-callout: none;
            user-select: none;
            background-color: #f596c685;
            transition: background-color 1s ease-in-out;
            font-family: 'Arial', sans-serif;
        }

        /* SECTION 1 – HERO */
        #hero {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        /* floating heart canvas */
        #c {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
            filter: contrast(3);
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        /* huge valentine headline */
        h1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            z-index: 2;
            color: #f84141;
            transition: color 1s ease-in-out;
            font-size: clamp(2.8rem, 14vw, 7em);
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 2px 2px 16px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
            gap: 0.2em;
        }

        h1 span {
            display: inline-block;
            font-size: 1.2em;
        }

        /* click hint – fades after first click */
        p#clickHere {
            text-transform: uppercase;
            padding: 1em 1.8em;
            background: rgba(238, 85, 85, 0.1);
            border-radius: 60px;
            font-size: 0.9rem;
            letter-spacing: 6px;
            color: #733;
            border: 1px solid rgba(238, 85, 85, 0.25);
            backdrop-filter: blur(3px);
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            margin: 0;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: opacity 0.6s ease;
        }

        /* ===== SCROLL REMINDER – appears 2s after first click ===== */
        .scroll-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(255, 235, 235, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 100px;
            padding: 14px 32px;
            color: #b13b3b;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(200, 70, 70, 0.2);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            border: 1.5px solid rgba(255, 120, 120, 0.7);
            cursor: pointer;
        }

        .scroll-hint.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .scroll-arrow {
            display: inline-block;
            font-size: 1.5rem;
            color: #d44;
        }

        /* Right arrow animation */
        .scroll-arrow.right {
            animation: bounceRight 1.4s infinite ease-in-out;
        }

        /* Left arrow animation */
        .scroll-arrow.left {
            animation: bounceLeft 1.4s infinite ease-in-out;
        }

        @keyframes bounceRight {

            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(6px);
            }
        }

        @keyframes bounceLeft {

            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-6px);
            }
        }

        /* fade-out transition for first layer */
        body.is-transitioning h1,
        body.is-transitioning #clickHere,
        body.is-transitioning #scrollReminder,
        body.is-transitioning #c {
            transition: opacity 700ms ease, transform 700ms ease, filter 700ms ease;
            opacity: 0;
            transform: translateY(-10px) scale(0.98);
            filter: blur(2px);
        }

        /* smaller screens */
        @media (max-width: 600px) {
            p#clickHere {
                padding: 0.8em 1.2em;
                font-size: 0.7rem;
                bottom: 20px;
                letter-spacing: 4px;
            }

            h1 {
                font-size: clamp(2rem, 12vw, 5em);
            }

            .scroll-hint {
                padding: 12px 22px;
                font-size: 0.9rem;
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- SECTION 1: canvas + headline -->
    <section id="hero">
        <h1><span>💖</span> Happy Valentine's Day! <span>💖</span></h1>
        <p id="clickHere">✦ click me everywhere ✦</p>
        <canvas id="c"></canvas>

        <!-- scroll reminder (appears 2s after first click) -->
        <div id="scrollReminder" class="scroll-hint" aria-label="Scroll down">
            <span class="scroll-arrow right">👉</span>
            <span id="pressButton">Press</span>
            <span class="scroll-arrow left">👈</span>
        </div>
    </section>

    <script>
        (function () {
            "use strict";

            // ----- canvas + hearts (first section) -----
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');
            const headline = document.querySelector('h1');
            const hint = document.getElementById('clickHere');
            const scrollReminder = document.getElementById('scrollReminder');
            const pressButton = document.getElementById('pressButton');

            const RAD = Math.PI / 180;
            const SPEED = 2.6;
            const MAX_HEARTS = 160;
            const randHeart = () => Math.random() < 0.5 ? '❤️' : '❣️';

            function Sprite(x, y, rot) {
                this.x = (x ?? Math.random() * canvas.width);
                this.y = (y ?? Math.random() * canvas.height);
                this.rot = (rot ?? Math.random() * 360);
                this.color = 'rgba(238,85,85,1)';
                this.text = randHeart();
            }

            let hearts = [new Sprite(window.innerWidth * 0.5, window.innerHeight * 0.5, 45)];

            function setCanvasSize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            setCanvasSize();

            function drawHeart(x, y, symbol, color) {
                ctx.font = '4.8em "Arial", "Segoe UI", "Helvetica", sans-serif';
                ctx.fillStyle = color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(180,40,40,0.4)';
                ctx.shadowBlur = 10;
                ctx.fillText(symbol, x, y);
                ctx.shadowBlur = 0;
            }

            function clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

            function render() {
                clear();
                for (let i = 0; i < hearts.length; i++) {
                    const h = hearts[i];
                    drawHeart(h.x, h.y, h.text, h.color);

                    const angle = (h.rot + (Math.random() * 20 - 10)) * RAD;
                    h.x += Math.cos(angle) * SPEED;
                    h.y += Math.sin(angle) * SPEED;
                    h.rot += (Math.random() * 3 - 0.5);

                    if (h.x > canvas.width + 80) h.x = -60;
                    if (h.x < -80) h.x = canvas.width + 60;
                    if (h.y > canvas.height + 80) h.y = -60;
                    if (h.y < -80) h.y = canvas.height + 60;
                }

                if (hearts.length > MAX_HEARTS) hearts = hearts.slice(-MAX_HEARTS);
            }

            function animloop() { requestAnimationFrame(animloop); render(); }

            // ---------- scroll control ----------
            let firstClickHappened = false;
            let scrollUnlocked = false;

            function preventScrollWhenLocked(e) {
                if (!scrollUnlocked) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }

            // reminder appears 2s after first click
            function triggerScrollReminderAfterFirstClick() {
                if (firstClickHappened) return;
                firstClickHappened = true;

                setTimeout(() => {
                    if (scrollReminder) scrollReminder.classList.add('show');
                    // ✅ unlock scrolling now
                    scrollUnlocked = true;
                    document.body.style.overflowY = 'auto';
                    document.body.style.overflowX = 'hidden';
                }, 2000);
            }

            // ----- Event binding -----
            window.addEventListener('resize', setCanvasSize);

            // LOCK scroll until unlocked
            window.addEventListener('wheel', preventScrollWhenLocked, { passive: false });
            window.addEventListener('touchmove', preventScrollWhenLocked, { passive: false });
            window.addEventListener('keydown', (e) => {
                const keys = ['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End', ' '];
                if (!scrollUnlocked && keys.includes(e.key)) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, { passive: false });

            // canvas click: spawn heart + first-click timer
            function addHeartFromEvent(e) {
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                hearts.push(new Sprite(clientX, clientY, Math.random() * 360));
                triggerScrollReminderAfterFirstClick();  // start 2s timer (only once)
            }

            canvas.addEventListener('mousedown', addHeartFromEvent);
            canvas.addEventListener('touchstart', addHeartFromEvent, { passive: false });

            // headline click: romantic fade + heart + first-click timer
            let alphaLevel = 0.1;
            headline.addEventListener('click', function (e) {
                if (hint) {
                    hint.style.opacity = '0';
                    setTimeout(() => { hint.style.display = 'none'; }, 600);
                }

                if (alphaLevel < 0.32) alphaLevel += 0.018;
                if (alphaLevel < 0.3) {
                    headline.style.color = `rgba(238,85,85,${alphaLevel})`;
                    document.body.style.backgroundColor = `rgba(238,85,85,${alphaLevel})`;
                } else {
                    headline.style.color = 'rgb(250, 180, 180)';
                    document.body.style.backgroundColor = 'rgb(250, 210, 210)';
                }

                if (e.clientX && e.clientY) hearts.push(new Sprite(e.clientX, e.clientY, 0));
                triggerScrollReminderAfterFirstClick();
                e.stopPropagation();
            });

            // hint click also spawns heart + timer
            if (hint) {
                hint.addEventListener('click', function (e) {
                    hearts.push(new Sprite(e.clientX, e.clientY, 45));
                    triggerScrollReminderAfterFirstClick();
                    e.stopPropagation();
                });
            }

            // Press button click - open valentine-card.html in the same tab
            if (pressButton) {
                pressButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    // Navigate to valentine-card.html in the same tab
                    window.location.href = 'valentine-card.html';
                });
            }

            // scroll reminder click (but not on the Press button)
            if (scrollReminder) {
                scrollReminder.addEventListener('click', (e) => {
                    // Check if the click target is not the pressButton
                    if (e.target !== pressButton && !pressButton.contains(e.target)) {
                        if (!scrollUnlocked) return;
                        e.stopPropagation();
                    }
                });
            }

            // ----- initialise -----
            function setup() {
                setCanvasSize();
                // initial hearts
                for (let i = 0; i < 8; i++) {
                    hearts.push(new Sprite(
                        canvas.width * (0.2 + 0.6 * Math.random()),
                        canvas.height * (0.2 + 0.6 * Math.random()),
                        i * 45
                    ));
                }
            }

            setup();
            animloop();
        })();
    </script>
</body>

</html>
