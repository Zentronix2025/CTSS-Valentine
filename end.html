<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 CTSS | Valentine's Day 💖</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fef6f9;
            /* soft romantic white-pink */
            font-family: 'Segoe UI', 'Lato', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- falling hearts (subtle valentine vibe) --- */
        .heart-falling {
            color: #fbc1d0;
            position: absolute;
            font-size: 1.8rem;
            animation: falling 7s infinite linear;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            opacity: 0.5;
        }

        .heart-falling:nth-of-type(1) {
            bottom: 1200px;
            left: 8%;
            animation-delay: 0.2s;
        }

        .heart-falling:nth-of-type(2) {
            bottom: 1200px;
            left: 18%;
            animation-delay: 1.7s;
        }

        .heart-falling:nth-of-type(3) {
            bottom: 1200px;
            left: 28%;
            animation-delay: 0.9s;
        }

        .heart-falling:nth-of-type(4) {
            bottom: 1200px;
            left: 42%;
            animation-delay: 2.3s;
        }

        .heart-falling:nth-of-type(5) {
            bottom: 1200px;
            left: 55%;
            animation-delay: 1.2s;
        }

        .heart-falling:nth-of-type(6) {
            bottom: 1200px;
            left: 68%;
            animation-delay: 2.8s;
        }

        .heart-falling:nth-of-type(7) {
            bottom: 1200px;
            left: 78%;
            animation-delay: 0.4s;
        }

        .heart-falling:nth-of-type(8) {
            bottom: 1200px;
            left: 88%;
            animation-delay: 1.9s;
        }

        .heart-falling:nth-of-type(9) {
            bottom: 1200px;
            left: 96%;
            animation-delay: 2.1s;
        }

        .heart-falling:nth-of-type(10) {
            bottom: 1200px;
            left: 3%;
            animation-delay: 3.0s;
        }

        @keyframes falling {
            0% {
                transform: rotate(0deg);
                opacity: 0.6;
            }

            100% {
                bottom: -80px;
                transform: rotate(360deg);
                opacity: 0.1;
            }
        }

        /* --- main card with double frame --- */
        .logo-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            padding: 60px 50px 70px 50px;
            border-radius: 120px 30px 120px 30px;
            box-shadow: 0 30px 50px rgba(190, 120, 150, 0.3),
                0 0 0 6px #ffffff,
                0 0 0 12px #fad5e5;
            text-align: center;
            max-width: 800px;
            width: 90%;
            border: 2px solid white;
            transition: 0.4s ease;
            z-index: 10;
        }

        .company-logo {
            max-width: 380px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
            filter: drop-shadow(0 10px 15px rgba(150, 60, 100, 0.25));
            transition: transform 0.3s ease;
        }

        .company-logo:hover {
            transform: scale(1.02);
        }

        .slogan {
            font-family: 'Pacifico', 'Segoe UI', cursive;
            font-size: 2.4rem;
            background: linear-gradient(145deg, #b3406a, #831f46);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-top: 25px;
            text-shadow: 0 4px 20px #ffc1d0;
            line-height: 1.3;
        }

        .slogan span {
            display: inline-block;
            border-bottom: 3px dotted #f7a8be;
            padding-bottom: 8px;
        }

        .tiny-credit {
            margin-top: 50px;
            font-family: 'Lato', sans-serif;
            color: #cc8caa;
            font-size: 1rem;
            opacity: 0.7;
            z-index: 10;
        }

        .fallback-logo {
            display: none;
            font-size: 120px;
            color: #c54d7c;
            margin-bottom: 15px;
        }

        /* --- BACK TO HOME BUTTON (left top, beautiful) --- */
        .back-home {
            position: fixed;
            /* stays on top left even when scroll (though page is short) */
            top: 24px;
            left: 24px;
            z-index: 999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 240, 245, 0.8);
            backdrop-filter: blur(4px);
            padding: 10px 22px 10px 20px;
            border-radius: 60px;
            /* pill shape */
            border: 2px solid #ffffff;
            box-shadow: 0 8px 20px rgba(210, 100, 140, 0.25),
                0 2px 0 2px #fce4ec;
            font-family: 'Lato', sans-serif;
            font-weight: 600;
            font-size: 1.15rem;
            color: #a13e5f;
            text-decoration: none;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .back-home i {
            font-size: 1.6rem;
            color: #c1557a;
            transition: transform 0.2s;
        }

        .back-home:hover {
            background: #ffffff;
            border-color: #ffb0c3;
            box-shadow: 0 10px 22px rgba(200, 70, 120, 0.35), 0 2px 0 2px #ffdae5;
            transform: translateY(-2px);
        }

        .back-home:hover i {
            transform: translateX(-3px);
        }

        /* adjust for very small screens: button gets slightly smaller */
        @media (max-width: 500px) {
            .back-home {
                padding: 7px 16px 7px 14px;
                font-size: 1rem;
                top: 16px;
                left: 16px;
            }

            .back-home i {
                font-size: 1.3rem;
            }

            .logo-card {
                padding: 40px 25px 50px 25px;
            }

            .slogan {
                font-size: 1.8rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lato:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <!-- falling hearts (ambiance) -->
    <span class="heart-falling">❤️</span><span class="heart-falling">❤️</span><span class="heart-falling">❤️</span>
    <span class="heart-falling">❤️</span><span class="heart-falling">❤️</span><span class="heart-falling">❤️</span>
    <span class="heart-falling">❤️</span><span class="heart-falling">❤️</span><span class="heart-falling">❤️</span>
    <span class="heart-falling">❤️</span>

    <!-- ========== LOVELY BACK TO HOME BUTTON ========== -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
    </a>
    <!-- note: replace href with actual home URL; demo onclick shows interactivity -->

    <!-- main logo container (exactly as given) -->
    <div class="logo-card">
        <!-- company logo: logo.png (with fallback) -->
        <img src="logo.png" alt="Company Logo" class="company-logo"
            onerror="this.style.display='none'; document.getElementById('fallbackIcon').style.display='block';">

        <!-- fallback in case logo.png is not found -->
        <div id="fallbackIcon" class="fallback-logo" style="display: none;">
            <i class="fa fa-heartbeat" style="font-size:150px; color:#b84a72;"></i>
        </div>

        <!-- slogan exactly as requested -->
        <div class="slogan">
            <span>✨ Your Feature Our Solutions ! ✨</span>
        </div>
    </div>

    <div class="tiny-credit">
        with love from the CTSS
    </div>

    <script>
        // if logo.png is missing, show fallback
        window.addEventListener('load', function () {
            const logo = document.querySelector('.company-logo');
            const fallback = document.getElementById('fallbackIcon');
            if (logo && logo.complete && logo.naturalHeight === 0) {
                logo.style.display = 'none';
                fallback.style.display = 'block';
            }
        });
    </script>
</body>

</html>
